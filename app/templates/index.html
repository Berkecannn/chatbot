<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destek Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="prechat-container" class="hidden flex flex-col h-screen max-w-2xl mx-auto bg-white shadow-lg p-8">
        <!-- Pre-chat form will be rendered here by chat.js -->
    </div>
    <div id="chat-container" class="flex flex-col h-screen max-w-2xl mx-auto bg-white shadow-lg">
        <header id="chat-header" class="text-white p-4 flex justify-between items-center">
            <div class="flex items-center">
                <img id="chat-header-bot-icon" src="{{ url_for('static', filename=theme_settings.bot_icon_path or 'default_bot_icon.png') }}" alt="Bot Icon" class="h-8 w-8 rounded-full mr-3">
                <h1 class="text-2xl font-bold">{{ theme_settings.bot_name or 'Destek Chatbot' }}</h1>
            </div>
            <button id="theme-toggle-btn" class="p-2 rounded-md text-white hover:bg-indigo-500 focus:outline-none">
                <svg class="theme-icon-light h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg class="theme-icon-dark h-6 w-6 hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </header>
        <main id="chatbox" class="flex-1 p-6 overflow-y-auto space-y-4"></main>
        <footer class="p-4 bg-gray-100 border-t">
            <div class="flex items-center">
                <input type="text" id="userInput" placeholder="Sorunuzu yazın..." class="flex-1 px-4 py-2 border rounded-l-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <button id="sendBtn" class="bg-indigo-600 text-white px-6 py-2 rounded-r-lg hover:bg-indigo-700 transition-colors">Gönder</button>
            </div>
            <div class="text-center mt-2">
                <button id="requestHumanBtn" class="text-sm text-indigo-600 hover:underline">Müşteri Temsilcisine Bağlan</button>
            </div>
        </footer>
    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
